name: protocol
on:
  pull_request:
  push:
    branches: [main, pr1/protocol]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - run: python -m pip install -r tools/requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run typecheck && npm test
      - run: python tools/check_protocol.py
      - run: python -m unittest discover -s tests/interop -v
      - run: python -B tools/mutate.py
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo check --locked --no-default-features
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/vectors.py check
      - name: Read pinned oracle revision
        id: oracle
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open('protocol/vectors/provenance.json'))
          print('commit=' + p['generator']['commit'])
          PY
      - uses: actions/checkout@v4
        with:
          repository: ristik/bft-core
          ref: ${{ steps.oracle.outputs.commit }}
          path: .oracle
          # Regeneration fetches this pinned commit into an isolated checkout.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: .oracle/go.mod
          cache: false
      - run: python3 tools/vectors.py regenerate --oracle .oracle
