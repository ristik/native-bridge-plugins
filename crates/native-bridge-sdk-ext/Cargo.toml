[package]
name = "native-bridge-sdk-ext"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Native Unicity bridge extensions over the unicity-token SDK (v3.0.1): lock-proof verification, strict history semantics, return-proof assembly."

[features]
default = ["alloc", "host", "consolidation"]
alloc = []
# The redemption's consolidated path: the SDK's uc-consolidation outcome types (its `client` feature, alloc only).
consolidation = ["alloc", "unicity-token/client"]
# Host conveniences: std error integration, JSON trust-document and manifest loading, and the nb2 journal, RPC reader and
# bridge. Native targets only: it uses std threads, clocks and the OS random source (no wasm32-unknown-unknown build).
host = ["alloc", "unicity-token/std", "k256/std", "sha2/std", "sha3/std", "dep:serde", "dep:serde_json", "dep:getrandom", "unicity-token/client"]

[dependencies]
unicity-token = { git = "https://github.com/ristik/state-transition-sdk-rust.git", rev = "de79e6c1e393a1846b75bca0640b9ec9a55aa143", default-features = false, features = ["alloc"] }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
sha3 = { version = "=0.10.9", default-features = false }
num-bigint = { version = "=0.4.8", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1", optional = true }
getrandom = { version = "0.2", optional = true }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
unicity-token = { git = "https://github.com/ristik/state-transition-sdk-rust.git", rev = "de79e6c1e393a1846b75bca0640b9ec9a55aa143", features = ["std", "client", "test-fixtures"] }
